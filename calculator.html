<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Calculator</title>
<style>
  /* ---- Design tokens -------------------------------------------------- */
  :root{
    --bg:        #e7e9ee;   /* page behind the device                    */
    --case:      #14161b;   /* calculator body                           */
    --screen:    #0c0e12;   /* display well                              */
    --ink:       #f5f7fa;   /* primary readout                           */
    --ink-dim:   #79828f;   /* expression / preview                      */
    --num:       #21242c;   /* digit keys                                */
    --num-ink:   #f3f4f6;
    --fn:        #181b21;   /* function keys (sin, ln, ...)              */
    --fn-ink:    #9aa3b1;
    --op:        #262b34;   /* operator keys                             */
    --op-ink:    #f0b35b;   /* warm amber accent                         */
    --util-ink:  #d98a8a;   /* clear / delete                            */
    --accent:    #f0b35b;   /* equals fill                               */
    --accent-2:  #d99a3e;
    --edge:      #2b303a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:14px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .device{
    width:100%;max-width:392px;
    background:var(--case);
    border-radius:22px;
    padding:16px 16px 18px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px rgba(0,0,0,.28);
  }

  /* ---- Display -------------------------------------------------------- */
  .screen{
    background:var(--screen);
    border:1px solid var(--edge);
    border-radius:14px;
    padding:14px 16px 12px;
    margin-bottom:14px;
    text-align:right;
    overflow:hidden;
  }
  .screen .expr{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(20px,7vw,28px);
    line-height:1.25;
    color:var(--ink);
    min-height:1.25em;
    word-break:break-all;
    white-space:pre-wrap;
  }
  .screen .preview{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:14px;
    color:var(--ink-dim);
    min-height:1.2em;
    margin-top:4px;
  }
  .screen .preview.err{color:var(--util-ink);}

  /* ---- Keypad --------------------------------------------------------- */
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  button{
    -webkit-appearance:none;appearance:none;border:none;
    font-family:inherit;cursor:pointer;
    border-radius:12px;
    padding:0;height:48px;
    font-size:16px;font-weight:600;
    color:var(--num-ink);background:var(--num);
    border:1px solid var(--edge);
    transition:transform .04s ease, filter .12s ease, background .12s ease;
    user-select:none;
  }
  button:hover{filter:brightness(1.12);}
  button:active{transform:translateY(1px) scale(.985);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  button.fn { background:var(--fn); color:var(--fn-ink); font-size:14px; font-weight:600; }
  button.op { background:var(--op); color:var(--op-ink); font-size:19px; }
  button.util{ background:var(--fn); color:var(--util-ink); font-size:15px; }
  button.mode{
    background:var(--fn); color:var(--fn-ink);
    font-size:12px; letter-spacing:.04em; font-weight:700;
  }
  button.mode .on{color:var(--accent);}
  button.eq{
    grid-column:span 5;
    background:var(--accent);color:#1a1206;
    font-size:20px;font-weight:800;height:50px;
    border:1px solid var(--accent-2);
  }
  button.eq:hover{filter:brightness(1.04);}

  @media (prefers-reduced-motion:reduce){
    button{transition:none;}
    button:active{transform:none;}
  }
</style>
</head>
<body>
  <main class="device" role="application" aria-label="Scientific calculator" tabindex="0">
    <div class="screen">
      <div class="expr" id="expr" aria-live="polite">0</div>
      <div class="preview" id="preview" aria-live="polite"></div>
    </div>
    <div class="pad" id="pad"></div>
  </main>

<script>
(function(){
"use strict";
/* =====================================================================
   Exam Calculator — single file, no network, no storage, no eval().
   Math engine: tokenizer -> shunting-yard (RPN) -> stack evaluator.
   ===================================================================== */

/* ---- 1. Math engine -------------------------------------------------- */
const FUNCS  = new Set(['sin','cos','tan','asin','acos','atan','sqrt','ln','log','exp','abs']);
const CONSTS = { pi: Math.PI, e: Math.E };
const PREC   = { 'u-':4, '^':5, '*':3, '/':3, '%':3, '+':2, '-':2 };
// Every name the tokenizer accepts ("ans" = result of the last "="), longest
// first, so a run of letters splits greedily: "esin" -> e, sin; "exp" stays exp.
const NAMES  = [...FUNCS, ...Object.keys(CONSTS), 'ans'].sort((a,b)=>b.length-a.length);

// Replace display glyphs with parser-readable ASCII / names.
function normalize(s){
  return s
    .replace(/\u00D7/g,'*')   // ×
    .replace(/\u00F7/g,'/')   // ÷
    .replace(/\u2212/g,'-')   // −
    .replace(/\u221A/g,' sqrt ')//√
    .replace(/\u03C0/g,' pi '); //π
}

function tokenize(str){
  const out=[]; let i=0;
  const dig=c=>c>='0'&&c<='9';
  const alp=c=>(c>='a'&&c<='z')||(c>='A'&&c<='Z');
  while(i<str.length){
    const c=str[i];
    if(c===' '){i++;continue;}
    if(dig(c)||c==='.'){
      let j=i,dot=false;
      while(j<str.length && (dig(str[j])||(str[j]==='.'&&!dot))){ if(str[j]==='.')dot=true; j++; }
      if(str[j]==='.') throw new Error('Unexpected "."');   // 1.2.3
      out.push({t:'num',v:parseFloat(str.slice(i,j))}); i=j; continue;
    }
    if(alp(c)){
      const rest=str.slice(i).toLowerCase();
      const name=NAMES.find(n=>rest.startsWith(n));
      if(!name){ let j=i; while(j<str.length && alp(str[j])) j++; throw new Error('Unknown "'+str.slice(i,j)+'"'); }
      out.push({t:'name',v:name}); i+=name.length; continue;
    }
    if('+-*/^%!()'.indexOf(c)>=0){ out.push({t:'op',v:c}); i++; continue; }
    throw new Error('Unexpected "'+c+'"');
  }
  return out;
}

function toRPN(tokens, ans){
  const out=[], ops=[];
  let prev=null; // 'val' | 'op' | 'open' | 'func' | null
  const unaryCtx = ()=> prev===null||prev==='op'||prev==='open'||prev==='func';
  // Shunting-yard core: pop operators that bind at least as tightly, then push.
  const applyOp = (op)=>{
    const my=PREC[op];
    while(ops.length){
      const top=ops[ops.length-1];
      if(top.t!=='op') break;
      const tp=PREC[top.v];
      const rightAssoc = (op==='^');
      if(tp>my || (tp===my && !rightAssoc)) out.push(ops.pop());
      else break;
    }
    ops.push({t:'op',v:op});
  };
  let funcPending=false; // a function name must be followed immediately by "("
  for(const tk of tokens){
    // A function only applies to a parenthesised argument: reject e.g. √9 or
    // sin30 (which would otherwise swallow the rest as sqrt(9+7) / sin(31)).
    if(funcPending){
      if(!(tk.t==='op' && tk.v==='(')) throw new Error('Expected "(" after function');
      funcPending=false;
    }
    // Implicit multiplication: a completed value (number, constant, ")" or "!")
    // directly followed by another value, a "(", or a function -> insert "*".
    // e.g. 2pi, 2(3), 2sin(30), (1+2)(3+4).
    const opensValue = tk.t==='num' || tk.t==='name' || (tk.t==='op' && tk.v==='(');
    if(opensValue && prev==='val'){ applyOp('*'); }

    if(tk.t==='num'){ out.push({t:'num',v:tk.v}); prev='val'; continue; }
    if(tk.t==='name'){
      if(FUNCS.has(tk.v)){ ops.push({t:'func',v:tk.v}); prev='func'; funcPending=true; }
      else { out.push({t:'num',v: tk.v==='ans' ? ans : CONSTS[tk.v]}); prev='val'; }
      continue;
    }
    const op=tk.v;
    if(op==='('){ ops.push({t:'paren'}); prev='open'; continue; }
    if(op===')'){
      while(ops.length && ops[ops.length-1].t!=='paren') out.push(ops.pop());
      if(!ops.length) throw new Error('Mismatched )');
      ops.pop();
      if(ops.length && ops[ops.length-1].t==='func') out.push(ops.pop());
      prev='val'; continue;
    }
    if(op==='!'){ out.push({t:'op',v:'!'}); prev='val'; continue; } // postfix
    if(op==='+' && unaryCtx()){ prev='op'; continue; }              // unary plus: drop
    if(op==='-' && unaryCtx()){ ops.push({t:'op',v:'u-'}); prev='op'; continue; } // prefix
    applyOp(op); prev='op';
  }
  if(funcPending) throw new Error('Expected "(" after function');
  while(ops.length){
    const top=ops.pop();
    if(top.t==='paren') throw new Error('Mismatched (');
    out.push(top);
  }
  return out;
}

// Snap x to a nonzero integer within 1e-14 (relative) of it, removing
// conversion noise: asin(0.5)=30 (not 30.000000000000004), tan(45)=1, sqrt(2)^2 -> 2.
function snapInt(x){
  const r=Math.round(x);
  return r!==0 && Math.abs(x-r) <= 1e-14*Math.abs(r) ? r : x;
}

function factorial(n){
  n=snapInt(n);
  if(n<0 || !Number.isInteger(n)) return NaN;
  if(n>170) return Infinity;
  let r=1; for(let k=2;k<=n;k++) r*=k; return r;
}

// [sin, cos] of a in degrees. a is reduced exactly to d in [-45°, 45°] around
// the nearest multiple of 90° (q quadrants) and the quadrant symmetry applied:
// multiples of 90° give exact 0 / ±1, and accuracy holds near them.
function sinCosDeg(a){
  const r=a%360, q=Math.round(r/90), d=(r-90*q)*Math.PI/180;
  const s=Math.sin(d), c=Math.cos(d);
  switch(((q%4)+4)%4){
    case 0:  return [ s,  c];
    case 1:  return [ c, -s];
    case 2:  return [-s, -c];
    default: return [-c,  s];
  }
}

// sin / cos / tan; tan = sin/cos, so a zero cosine is a division by zero
// (tan(90°) undefined). In RAD, a value below the rounding error of the
// argument is 0: sin(π) = 1.2e-16 -> 0, cos(π÷2) -> 0.
function trig(f, a, deg){
  let s, c;
  if(deg) [s,c]=sinCosDeg(a);
  else {
    const z = v=> Math.abs(v) <= 4*Number.EPSILON*Math.abs(a) ? 0 : v;
    s=z(Math.sin(a)); c=z(Math.cos(a));
  }
  return f==='sin' ? s : f==='cos' ? c : snapInt(s/c);
}

function evalRPN(rpn, deg){
  const st=[];
  // Every intermediate value must be finite: 1÷(1÷0) is an error, not 0.
  const push = v=>{ if(!Number.isFinite(v)) throw new Error('Error'); st.push(v); };
  const frR = x=> deg ? x*180/Math.PI : x;
  for(const tk of rpn){
    if(tk.t==='num'){ push(tk.v); continue; }
    if(tk.t==='func'){
      const a=st.pop(); let r;
      switch(tk.v){
        case 'sin':
        case 'cos':
        case 'tan': r=trig(tk.v, a, deg); break;
        case 'asin':r=snapInt(frR(Math.asin(a))); break;
        case 'acos':r=snapInt(frR(Math.acos(a))); break;
        case 'atan':r=snapInt(frR(Math.atan(a))); break;
        case 'sqrt':r=Math.sqrt(a); break;
        case 'ln':  r=Math.log(a); break;
        case 'log': r=Math.log10(a); break;
        case 'exp': r=Math.exp(a); break;
        case 'abs': r=Math.abs(a); break;
        default: throw new Error('fn');
      }
      push(r); continue;
    }
    if(tk.v==='u-'){ push(-st.pop()); continue; }
    if(tk.v==='!'){ push(factorial(st.pop())); continue; }
    const b=st.pop(), a=st.pop(); let r;
    switch(tk.v){
      case '+': r=a+b; break;
      case '-': r=a-b; break;
      case '*': r=a*b; break;
      case '/': r=a/b; break;
      case '^': r=Math.pow(a,b); break;
      case '%': r=a%b; break; // modulo
      default: throw new Error('op');
    }
    push(r);
  }
  if(st.length!==1) throw new Error('Invalid');
  return st[0];
}

// ans: value of "Ans" (the full-precision result of the last "=").
function compute(displayExpr, deg, ans){
  return evalRPN(toRPN(tokenize(normalize(displayExpr)), ans), deg);
}

// Display text: exact integers in full; otherwise 12 significant digits
// (strips binary float noise), with the exponent written as ×10^n, never as
// "e" (which is Euler's number here).
function fmt(x){
  if(Number.isSafeInteger(x)) return String(x);
  const [m, e] = x.toPrecision(12).split('e');
  return String(parseFloat(m)) + (e ? '\u00D710^' + Number(e) : '');
}

/* ---- 2. State + rendering ------------------------------------------- */
let expr = '';
let ans = 0;             // full-precision result of the last "=", shown as "Ans"
let deg = true;          // angle mode: true=DEG, false=RAD
let justEvaluated = false;

const device    = document.querySelector('.device');
const exprEl    = document.getElementById('expr');
const previewEl = document.getElementById('preview');

function render(){
  previewEl.classList.remove('err');
  if(justEvaluated){ exprEl.textContent = fmt(ans); previewEl.textContent=''; return; }
  exprEl.textContent = expr === '' ? '0' : expr;
  if(expr===''){ previewEl.textContent=''; return; }
  try{
    previewEl.textContent = '= ' + fmt(compute(expr, deg, ans));
  }catch(_){
    previewEl.textContent = '';
  }
}

function insert(s){
  if(justEvaluated){
    // After "=" (expr is "Ans"), a binary/postfix operator continues from Ans;
    // anything that begins a new value (digit, ., (, function, \u221A, \u03C0, e) starts fresh.
    const continues = /^[-+*/^!%\u2212\u00D7\u00F7]$/.test(s);
    if(!continues) expr='';
    justEvaluated=false;
  }
  if(s==='.'){
    const run = /[0-9.]*$/.exec(expr)[0];   // trailing run of the current number
    if(run.indexOf('.')>=0) return;         // reject a second point (1.2.3, 1..2)
    if(run==='') s='0.';                    // start a fresh number as 0. not .
  }
  expr += s;
  render();
}

function clearAll(){ expr=''; justEvaluated=false; render(); }
function del(){
  if(!expr) return;
  expr = expr.slice(0, /Ans$/.test(expr) ? -3 : -1);   // "Ans" is one token
  justEvaluated=false; render();
}

// Index where the trailing operand begins: a number, a parenthesised/function
// group ending in ")", or a constant (\u03C0 / e / Ans), each with any trailing
// "!". -1 if there is none.
function operandStart(s){
  const t = s.replace(/!+$/,'');         // 5! -> negate the factorial as a whole
  if(!t) return -1;
  if(t[t.length-1]===')'){              // walk back to the matching "("
    let depth=0, i=t.length-1;
    for(; i>=0; i--){
      if(t[i]===')') depth++;
      else if(t[i]==='('){ if(--depth===0) break; }
    }
    if(i<0) return -1;                   // unbalanced \u2014 bail out
    let j=i;                             // absorb a preceding function name or \u221A
    while(j>0 && /[a-zA-Z\u221A]/.test(t[j-1])) j--;
    return j;
  }
  const m = t.match(/(\d+\.?\d*|\.\d+|\u03C0|[a-zA-Z]+)$/);   // number, \u03C0, e / Ans
  return m ? t.length - m[0].length : -1;
}

function toggleSign(){
  const start = operandStart(expr);
  if(start<0) return;
  const before = expr[start-1], b2 = expr[start-2];
  if((before==='\u2212' || before==='-') &&
     (start===1 || '+\u2212-\u00D7\u00F7*/^(%'.indexOf(b2)>=0)){
    expr = expr.slice(0,start-1) + expr.slice(start);   // remove a unary sign
  } else {
    // An operand joined by implied multiplication (2\u03C0, 2(3)) gets an explicit
    // \u00D7, so the sign negates it instead of becoming a subtraction.
    const joined = /[0-9.)!\u03C0a-zA-Z]/.test(before || '');
    expr = expr.slice(0,start) + (joined ? '\u00D7\u2212' : '\u2212') + expr.slice(start);
  }
  justEvaluated=false; render();
}

function equals(){
  if(expr==='') return;
  try{
    ans = compute(expr, deg, ans);
    expr = 'Ans';
    justEvaluated=true;
    render();
  }catch(_){
    previewEl.classList.add('err');
    previewEl.textContent='Error';
  }
}

/* ---- 3. Keypad definition ------------------------------------------- */
// kind: num | op | fn | util | mode | eq ; ins: string to insert
const KEYS = [
  {label:'DEG', kind:'mode', act:'mode'},
  {label:'(',   kind:'op',  ins:'('},
  {label:')',   kind:'op',  ins:')'},
  {label:'\u232B', kind:'util', act:'del', aria:'Delete'},
  {label:'C',   kind:'util', act:'clear', aria:'Clear all'},

  {label:'sin', kind:'fn', ins:'sin('},
  {label:'cos', kind:'fn', ins:'cos('},
  {label:'tan', kind:'fn', ins:'tan('},
  {label:'\u221A', kind:'op', ins:'\u221A(', aria:'square root'},
  {label:'x\u02B8', kind:'op', ins:'^', aria:'power'},

  {label:'asin',kind:'fn', ins:'asin('},
  {label:'acos',kind:'fn', ins:'acos('},
  {label:'atan',kind:'fn', ins:'atan('},
  {label:'ln',  kind:'fn', ins:'ln('},
  {label:'log', kind:'fn', ins:'log('},

  {label:'7',kind:'num',ins:'7'},
  {label:'8',kind:'num',ins:'8'},
  {label:'9',kind:'num',ins:'9'},
  {label:'\u03C0',kind:'op',ins:'\u03C0',aria:'pi'},
  {label:'e', kind:'op',ins:'e',aria:'Euler number'},

  {label:'4',kind:'num',ins:'4'},
  {label:'5',kind:'num',ins:'5'},
  {label:'6',kind:'num',ins:'6'},
  {label:'!',kind:'op',ins:'!',aria:'factorial'},
  {label:'mod',kind:'op',ins:'%',aria:'modulo'},

  {label:'1',kind:'num',ins:'1'},
  {label:'2',kind:'num',ins:'2'},
  {label:'3',kind:'num',ins:'3'},
  {label:'\u00D7',kind:'op',ins:'\u00D7',aria:'multiply'},
  {label:'\u00F7',kind:'op',ins:'\u00F7',aria:'divide'},

  {label:'0',kind:'num',ins:'0'},
  {label:'.',kind:'num',ins:'.'},
  {label:'\u00B1',kind:'op',act:'sign',aria:'plus minus'},
  {label:'\u2212',kind:'op',ins:'\u2212',aria:'minus'},
  {label:'+',kind:'op',ins:'+',aria:'plus'},

  {label:'=', kind:'eq', act:'equals', aria:'equals'},
];

const pad = document.getElementById('pad');
let modeBtn = null;
for(const k of KEYS){
  const b=document.createElement('button');
  b.type='button';           // never submit a surrounding <form> (Moodle quiz)
  b.className=k.kind;
  if(k.kind==='mode') modeBtn=b;
  else { b.setAttribute('aria-label', k.aria || k.label); b.textContent=k.label; }
  b.addEventListener('click', (ev)=>{
    if(k.act==='mode')      toggleMode();
    else if(k.act==='del')  del();
    else if(k.act==='clear')clearAll();
    else if(k.act==='sign') toggleSign();
    else if(k.act==='equals')equals();
    else insert(k.ins);
    // A pointer click (detail > 0) moves focus from the key to the device:
    // Chromium focuses clicked buttons, and Enter/Space would repeat the key.
    if(ev.detail>0) device.focus({preventScroll:true});
  });
  pad.appendChild(b);
}

// DEG/RAD label with the active mode highlighted; the aria-label names it.
function renderMode(){
  modeBtn.innerHTML = deg ? '<span class="on">DEG</span> · RAD'
                          : 'DEG · <span class="on">RAD</span>';
  modeBtn.setAttribute('aria-label', 'Angle mode: ' + (deg ? 'degrees' : 'radians'));
}

function toggleMode(){ deg=!deg; renderMode(); render(); }

/* ---- 4. Physical keyboard ------------------------------------------- */
// The listener is on window, so keys work without a click when the calculator
// is the page itself or is pasted inline. Inside an <iframe> (the recommended
// Moodle embedding), keys reach it only once the iframe has focus, i.e. after
// a click on it. Inline, it yields while another field is being edited, so
// quiz inputs keep their keystrokes.

// True when focus is on an editable element that is NOT our calculator.
function editingElsewhere(el, root){
  return !!el && el!==root && !root.contains(el) &&
    (el.tagName==='INPUT' || el.tagName==='TEXTAREA' ||
     el.tagName==='SELECT' || el.isContentEditable===true);
}

window.addEventListener('keydown', (ev)=>{
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;        // leave shortcuts alone
  const el=document.activeElement;
  if(editingElsewhere(el, device)) return;
  const k=ev.key;
  // Enter evaluates only when focus is on the device or on no element; a
  // focused button or link (calculator key or host page) keeps its own Enter.
  if(k==='Enter' && el && el!==device && el!==document.body && el!==document.documentElement) return;
  if(k>='0' && k<='9'){ insert(k); ev.preventDefault(); return; }
  switch(k){
    case '.':
    case ',': insert('.'); break;          // decimal comma: it/de/pt layouts
    case '+': insert('+'); break;
    case '-': insert('\u2212'); break;
    case '*': insert('\u00D7'); break;
    case '/': insert('\u00F7'); break;
    case '^': insert('^'); break;
    case '(': insert('('); break;
    case ')': insert(')'); break;
    case '%': insert('%'); break;
    case '!': insert('!'); break;
    case '=':
    case 'Enter': equals(); break;
    case 'Backspace': del(); break;
    case 'Escape': clearAll(); break;
    default: return;
  }
  ev.preventDefault();
});

renderMode();
render();
})();
</script>
</body>
</html>
