<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Calculator — demo</title>
<style>
  :root{
    --page:   #f5f6f8;
    --bar:    #dfe2e8;   /* title bar of the calculator window */
    --edge:   #c3c8d0;
    --case:   #14161b;   /* button fill = calculator body      */
    --accent: #f0b35b;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{height:100%;}
  body{
    margin:0;min-height:100%;display:flex;padding:16px;
    background:var(--page);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }

  /* ---- Calculator window: a pop-up drawn inside the page --------------- */
  .window{
    width:422px;max-width:100%;margin:auto;   /* 420 px frame + border */
    border:1px solid var(--edge);border-radius:10px;overflow:hidden;
    background:#fff;box-shadow:0 18px 44px rgba(20,22,27,.22);
  }
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    height:34px;padding:0 6px 0 14px;
    background:var(--bar);border-bottom:1px solid var(--edge);
    font-size:.82rem;font-weight:600;color:#3a404a;
  }
  .bar button{
    width:26px;height:24px;padding:0;border:0;border-radius:6px;
    background:transparent;color:#3a404a;font-size:18px;line-height:1;cursor:pointer;
  }
  .bar button:hover{background:#c9ced7;}
  .window iframe{display:block;width:100%;height:610px;border:0;}

  /* Shown only after the window has been closed. */
  #show{
    margin:auto;padding:11px 18px;border:0;border-radius:12px;
    background:var(--case);color:var(--accent);font:inherit;font-weight:700;cursor:pointer;
  }
  #show:focus-visible,.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
  <main class="window" id="win" aria-label="Calculator window">
    <div class="bar">
      <span>Exam Calculator</span>
      <button type="button" id="close" aria-label="Close the calculator">&times;</button>
    </div>
    <iframe id="frame" src="calculator.html" title="Scientific calculator"></iframe>
  </main>
  <button type="button" id="show" hidden>Show the calculator</button>
<script>
(function(){
  var win = document.getElementById('win'), frame = document.getElementById('frame'),
      show = document.getElementById('show');

  // Keys go to the calculator without a click on it.
  function focusCalculator(){ frame.contentWindow.focus(); }
  frame.addEventListener('load', focusCalculator);

  // Closing hides the window; the calculator keeps its state until the page is left.
  document.getElementById('close').addEventListener('click', function(){
    win.hidden = true; show.hidden = false; show.focus();
  });
  show.addEventListener('click', function(){
    win.hidden = false; show.hidden = true; focusCalculator();
  });
})();
</script>
</body>
</html>
